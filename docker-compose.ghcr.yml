# Standalone: only this file and backend/.env are needed, no application sources.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-moviematch}
      POSTGRES_USER: ${DB_USER:-moviematch_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans backend/.env et utilisez --env-file backend/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/${GHCR_REPOSITORY:-samikarboubi/tp-agile}/backend:${IMAGE_TAG:-latest}
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-moviematch}
      DB_USER: ${DB_USER:-moviematch_app}
      DB_PASSWORD: ${DB_PASSWORD:?Renseignez DB_PASSWORD dans backend/.env}
      TMDB_MCP_COMMAND: tmdb-mcp
      TMDB_MCP_ARGS: "[]"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: ghcr.io/${GHCR_REPOSITORY:-samikarboubi/tp-agile}/frontend:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:5
    profiles: ["tools"]
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
