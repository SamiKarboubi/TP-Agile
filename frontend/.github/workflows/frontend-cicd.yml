name: Frontend CI/CD
 
on:
  push:
    branches: [main]
    paths:
      - "frontend_film/**"
  pull_request:
    branches: [main]
    paths:
      - "frontend_film/**"
 
defaults:
  run:
    working-directory: frontend_film
 
jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
 
      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend_film/package-lock.json
 
      - name: Installation des dépendances
        run: npm ci
 
      - name: Lint
        run: npm run lint
 
      - name: Build
        run: npm run build
 
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend_film/dist
 
